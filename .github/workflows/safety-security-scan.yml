name: "Medical Firmware Safety & Security Scan"

on:
  push:
    branches: [ main, next ]
  pull_request:
    branches: [ main, next ]
  # New CVEs are published against unchanged code: rescan the SBOM weekly.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  static-analysis:
    # Pinned: ubuntu-latest moved to 26.04, whose apt cppcheck (2.19) fails
    # on the CubeMX __ALIGN_END macro and reports new style findings. 24.04
    # ships cppcheck 2.13, the version this scan was validated with (#68).
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Analysis Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
          pip3 install lizard

      # 1. Cppcheck with MISRA-C:2012 and Safety focus
      # --error-exitcode=1 ensures the build fails on findings
      # The per-line suppressions are style findings (scope / const) in the
      # FDA preset code, not defects; left unrefactored so the bench images
      # match the reviewed source. Cleared by #67.
      - name: Run Cppcheck (Safety & Standards)
        run: |
          cppcheck --enable=warning,style,performance,portability \
                   --std=c11 \
                   --error-exitcode=1 \
                   --force \
                   --inline-suppr \
                   --template="[{severity}] {file}:{line} {id} - {message}" \
                   -I USB_DEVICE/Target \
                   -I Middlewares/ST/STM32_USB_Device_Library/Core/Inc \
                   --suppress=missingIncludeSystem \
                   --suppress=*:Core/Src/lwrb.c \
                   --suppress=*:Core/Src/jsmn.c \
                   --suppress=*:Core/Src/system_stm32l4xx.c \
                   --suppress=*:Core/Src/stm32l4xx_hal_msp.c \
                   --suppress=*:Core/Src/syscalls.c \
\
                   --suppress=constParameterPointer:Core/Src/tx7332.c:147 \
                   ./Core/Src ./USB_DEVICE/App

      # 2. Complexity Analysis (Lizard)
      # IEC 62304 recommends low cyclomatic complexity for testability.
      # Fails if any function exceeds a complexity of 15.
      # Third-party and ST-generated files are excluded; command-dispatcher
      # functions that are structurally complex by design are whitelisted
      # in lizard_whitelist.csv.
      - name: Check Code Complexity (IEC 62304 Requirement)
        run: |
          lizard ./Core/Src ./USB_DEVICE/App \
            -C 15 -L 100 -w \
            -x "*/jsmn.c" \
            -x "*/system_stm32l4xx.c" \
            -x "*/stm32l4xx_hal_msp.c" \
            --whitelist lizard_whitelist.csv

      # 3. Generate the SBOM from this checkout (it is a build output, not committed).
      # scripts/gen_sbom.py reads the HAL / CMSIS versions from the tree and takes
      # the toolchain and newlib (linked C library) versions from the build image
      # that builds the release. Everything else comes from the reviewed
      # scripts/sbom-manifest.json, whose components are hash-pinned to the vendored
      # files: this step FAILS if vendored code changed without a manifest review.
      - name: Generate SBOM
        run: |
          set -euo pipefail
          IMG=ghcr.io/openwaterhealth/stm32-build-env:latest
          docker pull -q "$IMG" > /dev/null
          IMG_REF="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMG")"
          TOOLCHAIN="$(docker run --rm "$IMG" arm-none-eabi-gcc --version | head -1)"
          NEWLIB="$(docker run --rm "$IMG" sh -c 'echo "#include <newlib.h>" | arm-none-eabi-gcc -E -dM -' \
                    | sed -n 's/^#define _NEWLIB_VERSION "\(.*\)"/\1/p')"
          test -n "$NEWLIB"
          python3 scripts/gen_sbom.py --root . --manifest scripts/sbom-manifest.json \
            --name "${GITHUB_REPOSITORY#*/}" --config Release \
            --toolchain "$TOOLCHAIN" --newlib-version "$NEWLIB" --build-image "$IMG_REF" \
            -o sbom.cdx.json

      # 4. Vulnerability scan of the generated SBOM
      # grype consumes the CycloneDX SBOM and checks each component against
      # the Grype vulnerability database (NVD, OSV, GHSA, and others).
      # Fails the build on any HIGH or CRITICAL finding. A clean result only
      # covers components with a CPE/purl the database knows (e.g. newlib); ST
      # middleware has no CVE feed, so scripts/sbom-manifest.json records known
      # issues there ("openwater:security-note") from manual review.
      - name: Scan SBOM for Vulnerabilities (grype)
        id: grype
        uses: anchore/scan-action@v6
        with:
          sbom: "sbom.cdx.json"
          fail-build: true
          severity-cutoff: high
          output-format: sarif

      # 5. Upload SARIF results to GitHub Security tab
      # Makes vulnerability findings visible in the repository's Security view.
      # Code Scanning (Security tab) requires GitHub Advanced Security, which is
      # off by default on private repos. Don't fail the scan if it isn't enabled:
      # grype already gates the build on HIGH/CRITICAL CVEs, and the SARIF is kept
      # as a build artifact below. Remove continue-on-error once GHAS is enabled.
      - name: Upload SARIF to GitHub Security
        if: always() && steps.grype.conclusion != 'skipped'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}

      # 6. Upload Audit Artifacts
      # Keeps a record of the scan results for regulatory submission.
      - name: Archive Regulatory Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-compliance-report
          path: |
            sbom.cdx.json
            ${{ steps.grype.outputs.sarif }}
